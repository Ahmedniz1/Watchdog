[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tripwire"
description = "Local-first, CI-friendly regression testing for LLM outputs."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ahmedniz1", email = "ahmednizamani36@gmail.com" }]
keywords = [
    "llm",
    "testing",
    "regression-testing",
    "evaluation",
    "prompt-engineering",
    "pytest",
    "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core install is intentionally dependency-free: the heuristic verifiers and
# the whole scoring/result layer are pure stdlib, so `pip install llm-tripwire`
# stays tiny and fast. The two heavy capabilities are opt-in extras below.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# Local embedding-based `semantic_similarity` (no data leaves the machine).
semantic = ["sentence-transformers>=2.0"]
# Calling models: the runner and the V2 `llm_judge` / `llm_factual` / `llm_rubric`.
llm = ["litellm>=1.0"]
# Everything, for users who just want it all.
all = ["sentence-transformers>=2.0", "litellm>=1.0"]
# Contributor tooling.
dev = ["pytest>=7.0", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/Ahmedniz1/Watchdog"
Repository = "https://github.com/Ahmedniz1/Watchdog"
Issues = "https://github.com/Ahmedniz1/Watchdog/issues"

[tool.setuptools]
# Single source of truth for the version: llm_tripwire/__init__.py. Safe to read
# at build time because importing the package never imports torch or litellm
# (those are deferred until a verifier actually runs).
packages = ["llm_tripwire"]

[tool.setuptools.dynamic]
version = { attr = "llm_tripwire.__version__" }

[tool.setuptools.package-data]
llm_tripwire = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
